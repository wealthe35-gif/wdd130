<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/rafting.css">
  <title>Contact Us | D Rafting Co</title>
  <meta name="description" content="Get in touch withD Rafting Co Company. Find our location map, call our rafting guides, view our employee profiles,
     or send us a message to book your next white-water rafting adventure.">
  <link rel="stylesheet" href="rafting.css">
</head>

<body>
  <header class="grid-header">
    <div class="logo-box">
      <img src="images/logo.jpg" alt="Company Logo" class="logo">
    </div>
    <nav class="flex-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <main class="contact-layout">

    <section class="company-heading">
      <h1>D Rafting Co</h1>

      <div class="info-details">
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p><strong>+1 999 999 9999</strong></p>
        <p class="email-text">info@whitewater.com</p>
      </div>
    </section>

    <div class="split-content-grid">

      <section class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3174.5852164376665!2d-121.76789059967471!3d36.75458300683512!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s123%20Main%20River%20Street%20%20Kolob%2C%20California%20%20%2B1%20999%20999%209999!5e0!3m2!1sen!2sng!4v1790888047963!5m2!1sen!2sng"
          width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>

      <section class="form-container">
        <form action="#" method="post">

          <div class="form-item">
            <label for="username">Name</label>
            <input type="text" id="username" name="username" placeholder="Placeholder" required>
          </div>

          <div class="form-item">
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" placeholder="Placeholder" required>
          </div>

          <div class="form-item">
            <fieldset>
              <legend>Message Purpose</legend>
              <div class="radio-group">
                <label><input type="radio" name="purpose" value="general" checked> General
                  Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation
                  Question</label>
                <label><input type="radio" name="purpose" value="suggestion"> Website
                  Suggestion</label>
              </div>
            </fieldset>
          </div>

          <div class="form-item">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Type here..."
              required></textarea>
          </div>

          <div class="form-item checkbox-item">
            <label>
              <input type="checkbox" name="subscribe" value="yes" checked>
              Please subscribe me to the monthly newsletter
            </label>
          </div>

          <button type="submit" class="btn-submit">Get in Touch!</button>
        </form>
      </section>
    </div>

    <section class="employee-profiles">
      <h2 class="section-banner">We Are Here to Serve You</h2>

      <div class="profile-grid">
        <figure>
          <div class="avatar-placeholder">
            <img src="images/Alex.jpg" alt="Smiling portrait of Alex">
          </div>
          <figcaption><strong>Employee Profile</strong><br>Alex Rivera - Senior Leader</figcaption>
        </figure>

        <figure>
          <div class="avatar-placeholder">
            <img src="images/sarah.jpg" alt="Portrait of Sarah">
          </div>
          <figcaption><strong>Employee Profile</strong><br>Sarah Jenkins - Logistics Director
          </figcaption>
        </figure>

        <figure>
          <div class="avatar-placeholder">
            <img src="images/micheal.jpg" alt="Portrait of Michael">
          </div>
          <figcaption><strong>Employee Profile</strong><br>Michael Chang - Hydrology Guide
          </figcaption>
        </figure>
      </div>
    </section>

  </main>

  <footer class="grid-footer">
    <p>&copy; 2026 D Rafting Co | Innocent Emmanuel</p>
    <div class="socialmedia">
      <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
          alt="Facebook Icon"></a>
      <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
          alt="Twitter Icon"></a>
      <a href="https://instagram.com" target="_blank"><img src="images/instagram_408758.png"
          alt="Instagram Icon" class="instagram-icon"></a>
    </div>
  </footer>
</body>

</html>
